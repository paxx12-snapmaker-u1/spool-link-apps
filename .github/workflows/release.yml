name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      version_code: ${{ steps.bump.outputs.version_code }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        run: |
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          latest=${latest:-v0.0.0}
          ver=${latest#v}
          IFS=. read -r major minor patch <<< "$ver"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          version="$major.$minor.$patch"
          version_code=$((major*10000 + minor*100 + patch))
          echo "Next version: $version (code $version_code)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  android:
    needs: compute-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/app/keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$PWD/android-app/app/keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PversionName=${{ needs.compute-version.outputs.version }} \
            -PversionCode=${{ needs.compute-version.outputs.version_code }}

      - name: Rename APK
        run: |
          mkdir -p release-out
          cp android-app/app/build/outputs/apk/release/*.apk \
            "release-out/spoollink-${{ needs.compute-version.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release-out/*.apk
          if-no-files-found: error

  ios:
    needs: compute-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Local.xcconfig
        working-directory: ios-app
        run: cp Local.xcconfig.sample Local.xcconfig

      - name: Archive
        working-directory: ios-app
        run: |
          xcodebuild archive \
            -project NFCSpoolReader.xcodeproj \
            -scheme SpoolLink \
            -configuration Release \
            -archivePath build/SpoolLink.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ needs.compute-version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ needs.compute-version.outputs.version_code }}

      - name: Package unsigned IPA
        working-directory: ios-app
        run: |
          mkdir -p build/Payload release-out
          cp -r build/SpoolLink.xcarchive/Products/Applications/SpoolLink.app build/Payload/
          cd build && zip -r "../release-out/spoollink-${{ needs.compute-version.outputs.tag }}.ipa" Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios-app/release-out/*.ipa
          if-no-files-found: error

  release:
    needs: [compute-version, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          name: ${{ needs.compute-version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/ipa/*.ipa
