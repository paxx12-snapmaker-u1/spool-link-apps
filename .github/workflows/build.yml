name: Build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/app/keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$PWD/android-app/app/keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: spoollink-${{ github.sha }}.apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Local.xcconfig
        working-directory: ios-app
        run: cp Local.xcconfig.sample Local.xcconfig

      - name: Archive
        working-directory: ios-app
        run: |
          xcodebuild archive \
            -project NFCSpoolReader.xcodeproj \
            -scheme SpoolLink \
            -configuration Release \
            -archivePath build/SpoolLink.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: ios-app
        run: |
          mkdir -p build/Payload
          cp -r build/SpoolLink.xcarchive/Products/Applications/SpoolLink.app build/Payload/
          cd build && zip -r SpoolLink.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: spoollink-${{ github.sha }}.ipa
          path: ios-app/build/SpoolLink.ipa
          if-no-files-found: error
